<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Puzzle Game</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #00d2ff; }
        body { 
            background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        h1 { margin-bottom: 10px; font-weight: 300; letter-spacing: 2px; }
        
        /* The Game Board */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(4, 70px); 
            grid-template-rows: repeat(4, 70px); 
            gap: 12px; 
            background: var(--card); padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .cell { 
            width: 70px; height: 70px; background: #2a2a2a; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 8px; position: relative;
        }

        /* The Arrows */
        .arrow { 
            font-size: 35px; cursor: pointer; color: var(--accent);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            user-select: none; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* Animations */
        .blocked { animation: shake 0.2s; color: #ff4b2b; }
        @keyframes shake {
            0%, 100% { transform: translate(0); }
            25% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        #win-message {
            display: none; position: absolute; top: 20%;
            background: rgba(0, 210, 255, 0.2); border: 1px solid var(--accent);
            padding: 20px 40px; border-radius: 50px; backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body>

    <div id="win-message">LEVEL COMPLETE!</div>
    <h1>ARROWS</h1>
    <div id="grid"></div>
    <p style="color: #666; margin-top: 20px;">Clear all arrows to win</p>

    <script>
        // 1: Right, 2: Down, 3: Left, 4: Up, 0: Empty
        const layout = [
            [1, 0, 2, 0],
            [0, 1, 0, 3],
            [4, 0, 2, 0],
            [0, 3, 0, 4]
        ];

        const gridElement = document.getElementById('grid');
        const rows = 4;
        const cols = 4;

        function initGame() {
            gridElement.innerHTML = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (layout[r][c] !== 0) {
                        const arrow = document.createElement('div');
                        arrow.className = 'arrow';
                        arrow.innerHTML = '➔';
                        arrow.style.transform = getRotation(layout[r][c]);
                        arrow.onclick = () => tryMove(r, c, arrow);
                        cell.appendChild(arrow);
                    }
                    gridElement.appendChild(cell);
                }
            }
        }

        function getRotation(type) {
            if (type === 1) return 'rotate(0deg)';
            if (type === 2) return 'rotate(90deg)';
            if (type === 3) return 'rotate(180deg)';
            if (type === 4) return 'rotate(270deg)';
        }

        function tryMove(r, c, element) {
            const type = layout[r][c];
            let isBlocked = false;

            // Check if any arrow is in the path
            if (type === 1) { // Right
                for (let i = c + 1; i < cols; i++) if (layout[r][i] !== 0) isBlocked = true;
            } else if (type === 2) { // Down
                for (let i = r + 1; i < rows; i++) if (layout[i][c] !== 0) isBlocked = true;
            } else if (type === 3) { // Left
                for (let i = c - 1; i >= 0; i--) if (layout[r][i] !== 0) isBlocked = true;
            } else if (type === 4) { // Up
                for (let i = r - 1; i >= 0; i--) if (layout[i][c] !== 0) isBlocked = true;
            }

            if (isBlocked) {
                element.classList.add('blocked');
                setTimeout(() => element.classList.remove('blocked'), 200);
            } else {
                // Fly off screen logic
                let tx = 0, ty = 0;
                if (type === 1) tx = 500;
                if (type === 2) ty = 500;
                if (type === 3) tx = -500;
                if (type === 4) ty = -500;

                element.style.transform += ` translate(${tx}px, ${ty}px)`;
                element.style.opacity = "0";
                element.style.pointerEvents = "none";
                layout[r][c] = 0; // Clear it from data
                checkWin();
            }
        }

        function checkWin() {
            const remaining = layout.flat().filter(x => x !== 0).length;
            if (remaining === 0) {
                document.getElementById('win-message').style.display = 'block';
            }
        }

        initGame();
    </script>
</body>
</html>
