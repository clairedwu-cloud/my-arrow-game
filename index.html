<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrows - Smart Mode</title>
    <style>
        :root {
            --bg: #0f172a;
            --slot: #1e293b;
            --arrow-idle: #475569; /* Grey for blocked */
            --arrow-active: #38bdf8; /* Blue for moveable */
        }
        body { 
            background: var(--bg); color: white; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: sans-serif; overflow: hidden;
        }

        #game-board {
            display: grid; grid-template-columns: repeat(5, 60px); grid-template-rows: repeat(5, 60px);
            gap: 10px; padding: 20px; background: #1e293b; border-radius: 24px; position: relative;
        }

        .slot { width: 60px; height: 60px; background: #334155; border-radius: 12px; opacity: 0.2; }

        .arrow {
            position: absolute; width: 60px; height: 60px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default; opacity: 0.5;
        }

        /* ONLY moveable arrows get these styles */
        .can-move {
            cursor: pointer;
            opacity: 1;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1) rotate(var(--rot)); }
            50% { transform: scale(1.05) rotate(var(--rot)); }
            100% { transform: scale(1) rotate(var(--rot)); }
        }

        .arrow::after { content: '▲'; font-size: 24px; color: var(--bg); }
    </style>
</head>
<body>

    <div id="game-board"></div>

    <script>
        const board = document.getElementById('game-board');
        let levelData = [
            { id: 1, r: 1, c: 1, dir: 90 }, 
            { id: 2, r: 1, c: 3, dir: 180 },
            { id: 3, r: 3, c: 3, dir: 270 },
            { id: 4, r: 3, c: 1, dir: 0 },  
            { id: 5, r: 2, c: 2, dir: 90 }  
        ];

        function init() {
            board.innerHTML = '';
            // Create slots
            for(let i=0; i<25; i++) board.appendChild(Object.assign(document.createElement('div'), {className:'slot'}));
            
            // Create arrows
            renderArrows();
            refreshLogic();
        }

        function renderArrows() {
            levelData.forEach(d => {
                let a = document.createElement('div');
                a.className = 'arrow';
                a.id = 'a' + d.id;
                a.style.setProperty('--rot', d.dir + 'deg');
                a.style.left = (d.c * 70 + 20) + 'px';
                a.style.top = (d.r * 70 + 20) + 'px';
                a.style.transform = `rotate(${d.dir}deg)`;
                a.style.background = 'var(--arrow-idle)';
                board.appendChild(a);
            });
        }

        function refreshLogic() {
            levelData.forEach(arrow => {
                const el = document.getElementById('a' + arrow.id);
                const blocked = checkCollision(arrow);
                
                if (!blocked) {
                    el.classList.add('can-move');
                    el.style.background = 'var(--arrow-active)';
                    el.onclick = () => moveOut(arrow);
                } else {
                    el.classList.remove('can-move');
                    el.style.background = 'var(--arrow-idle)';
                    el.onclick = null; // Disable clicking
                }
            });
        }

        function checkCollision(a) {
            return levelData.some(b => {
                if (a.id === b.id) return false;
                if (a.dir === 90) return b.r === a.r && b.c > a.c;
                if (a.dir === 270) return b.r === a.r && b.c < a.c;
                if (a.dir === 180) return b.c === a.c && b.r > a.r;
                if (a.dir === 0) return b.c === a.c && b.r < a.r;
                return false;
            });
        }

        function moveOut(a) {
            const el = document.getElementById('a' + a.id);
            let x=0, y=0;
            if(a.dir===90) x=500; if(a.dir===270) x=-500;
            if(a.dir===180) y=500; if(a.dir===0) y=-500;

            el.style.transform = `rotate(${a.dir}deg) translate(${x}px, ${y}px)`;
            el.style.opacity = '0';
            
            setTimeout(() => {
                levelData = levelData.filter(item => item.id !== a.id);
                refreshLogic(); // Re-check all arrows after one is gone
            }, 400);
        }

        init();
    </script>
</body>
</html>
