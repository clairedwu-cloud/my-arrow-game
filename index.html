<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Arrows</title>
    <style>
        :root { --bg: #0f172a; --slot: #1e293b; --active: #2dd4bf; --blocked: #475569; }
        body { background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        #game-board { 
            display: grid; grid-template-columns: repeat(6, 50px); grid-template-rows: repeat(6, 50px);
            gap: 8px; padding: 15px; background: #1e293b; border-radius: 15px; position: relative;
        }
        .slot { width: 50px; height: 50px; background: #334155; border-radius: 8px; opacity: 0.2; }

        .snake {
            position: absolute; border-radius: 8px;
            display: flex; align-items: center; justify-content: flex-end; /* Head at the front */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box; padding-right: 5px;
        }
        .snake::after { content: '▶'; font-size: 18px; color: rgba(0,0,0,0.5); }

        .can-move { cursor: pointer; filter: brightness(1.2); box-shadow: 0 0 15px rgba(45, 212, 191, 0.3); }
        
        #controls { margin-top: 20px; }
        button { padding: 10px 20px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="game-board"></div>
    <div id="controls">
        <button onclick="location.reload()">Reset Level</button>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const cellSize = 58; // 50px + 8px gap
        
        // Setup: r/c is the tail position. len is how many cells it covers.
        let snakes = [
            { id: 1, r: 1, c: 1, len: 3, dir: 90 },  // Horizontal Snake (Right)
            { id: 2, r: 0, c: 4, len: 2, dir: 180 }, // Vertical Snake (Down)
            { id: 3, r: 4, c: 5, len: 3, dir: 270 }, // Horizontal Snake (Left)
            { id: 4, r: 5, c: 1, len: 4, dir: 0 }    // Vertical Snake (Up)
        ];

        function init() {
            board.innerHTML = '';
            for(let i=0; i<36; i++) board.appendChild(Object.assign(document.createElement('div'), {className:'slot'}));
            renderSnakes();
        }

        function renderSnakes() {
            document.querySelectorAll('.snake').forEach(s => s.remove());
            snakes.forEach(s => {
                const el = document.createElement('div');
                el.className = 'snake';
                el.id = 's' + s.id;
                
                // Styling based on direction
                if(s.dir === 90 || s.dir === 270) { // Horizontal
                    el.style.width = (s.len * cellSize - 8) + 'px';
                    el.style.height = '50px';
                } else { // Vertical
                    el.style.width = '50px';
                    el.style.height = (s.len * cellSize - 8) + 'px';
                    el.style.flexDirection = 'column';
                    el.style.justifyContent = 'flex-end';
                }

                el.style.left = (s.c * cellSize + 15) + 'px';
                el.style.top = (s.r * cellSize + 15) + 'px';
                el.style.transform = `rotate(${s.dir === 180 ? 90 : s.dir === 0 ? 270 : 0}deg)`; // Adjust arrow head visual
                
                const moveable = isPathClear(s);
                el.style.background = moveable ? 'var(--active)' : 'var(--blocked)';
                if(moveable) {
                    el.classList.add('can-move');
                    el.onclick = () => moveSnake(s);
                }
                board.appendChild(el);
            });
        }

        // Check if any part of the snake's path is occupied by another snake
        function isPathClear(s) {
            // Calculate which cells THIS snake currently occupies
            const myCells = getOccupiedCells(s);
            
            // Look ahead based on direction
            let checkR = s.r, checkC = s.c;
            if(s.dir === 90) checkC += s.len; // Start checking from just past the head
            if(s.dir === 270) checkC -= 1;
            if(s.dir === 180) checkR += s.len;
            if(s.dir === 0) checkR -= 1;

            // Simple check: Is there any OTHER snake in the immediate next cell?
            return !snakes.some(other => {
                if(other.id === s.id) return false;
                const otherCells = getOccupiedCells(other);
                return otherCells.some(oc => {
                    // This is the simplified "blocked by immediate neighbor" logic
                    // You can expand this to check the entire path to the edge
                    if(s.dir === 90) return oc.r === s.r && oc.c > s.c + (s.len-1);
                    if(s.dir === 270) return oc.r === s.r && oc.c < s.c;
                    if(s.dir === 180) return oc.c === s.c && oc.r > s.r + (s.len-1);
                    if(s.dir === 0) return oc.c === s.c && oc.r < s.r;
                });
            });
        }

        function getOccupiedCells(s) {
            let cells = [];
            for(let i=0; i<s.len; i++) {
                if(s.dir === 90 || s.dir === 270) cells.push({r: s.r, c: s.c + i});
                else cells.push({r: s.r + i, c: s.c});
            }
            return cells;
        }

        function moveSnake(s) {
            const el = document.getElementById('s' + s.id);
            let x=0, y=0;
            if(s.dir===90) x=600; if(s.dir===270) x=-600;
            if(s.dir===180) y=600; if(s.dir===0) y=-600;

            el.style.transform += ` translate(${x}px, ${y}px)`;
            el.style.opacity = '0';
            
            setTimeout(() => {
                snakes = snakes.filter(item => item.id !== s.id);
                renderSnakes(); // Recalculate everything
            }, 500);
        }

        init();
    </script>
</body>
</html>
