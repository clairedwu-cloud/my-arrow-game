<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Long Arrows Puzzle</title>
    <style>
        body {
            background-color: #222;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }

        h2 { margin-bottom: 10px; font-weight: normal; letter-spacing: 2px; }
        
        #game-board {
            position: relative;
            width: 320px;
            height: 320px;
            background: #333;
            border-radius: 10px;
            /* Grid lines for visual reference */
            background-image: 
                linear-gradient(#444 1px, transparent 1px),
                linear-gradient(90deg, #444 1px, transparent 1px);
            background-size: 40px 40px;
            border: 2px solid #555;
        }

        .snake-arrow {
            position: absolute;
            background: #e74c3c; /* Red/Orange default */
            border-radius: 8px;
            box-sizing: border-box;
            border: 2px solid rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.5s;
            z-index: 10;
        }

        /* The Arrow Head Icon */
        .snake-arrow::after {
            content: '';
            border: solid white;
            border-width: 0 4px 4px 0;
            display: inline-block;
            padding: 4px;
        }

        /* Rotations for the arrow icon inside the block */
        .dir-0::after { transform: rotate(-135deg); margin-bottom: 10px; }   /* Up */
        .dir-1::after { transform: rotate(-45deg); margin-left: 10px; }      /* Right */
        .dir-2::after { transform: rotate(45deg); margin-top: 10px; }        /* Down */
        .dir-3::after { transform: rotate(135deg); margin-right: 10px; }     /* Left */

        /* Flex alignment to push the arrow head to the correct side */
        .dir-0 { align-items: flex-start; }
        .dir-1 { justify-content: flex-end; }
        .dir-2 { align-items: flex-end; }
        .dir-3 { justify-content: flex-start; }

        /* Shake animation for blocked moves */
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        #status { margin-top: 20px; color: #aaa; height: 20px; }
        button { margin-top: 15px; padding: 10px 20px; cursor: pointer; background: #555; color: white; border: none; border-radius: 5px;}
    </style>
</head>
<body>

    <h2>DEADLOCK</h2>
    <div id="game-board"></div>
    <div id="status">Tap an arrow to move</div>
    <button onclick="location.reload()">Reset</button>

    <script>
        const board = document.getElementById('game-board');
        const statusText = document.getElementById('status');
        const GRID_SIZE = 8; // 8x8 grid (40px per cell)
        const CELL_SIZE = 40;

        // Dir: 0=Up, 1=Right, 2=Down, 3=Left
        // Length: How many grid squares it occupies
        let arrows = [
            // A tight knot layout
            { id: 1, r: 2, c: 2, len: 3, dir: 1, color: '#3498db' }, // Blue Right
            { id: 2, r: 1, c: 4, len: 3, dir: 2, color: '#9b59b6' }, // Purple Down
            { id: 3, r: 3, c: 5, len: 2, dir: 3, color: '#e67e22' }, // Orange Left
            { id: 4, r: 4, c: 2, len: 2, dir: 0, color: '#2ecc71' }, // Green Up
            { id: 5, r: 0, c: 0, len: 2, dir: 1, color: '#f1c40f' }, // Yellow Top-Left
            { id: 6, r: 6, c: 3, len: 3, dir: 3, color: '#e74c3c' }, // Red Bottom
        ];

        function init() {
            render();
        }

        function render() {
            board.innerHTML = ''; // Clear board
            arrows.forEach(a => {
                const el = document.createElement('div');
                el.className = `snake-arrow dir-${a.dir}`;
                el.style.backgroundColor = a.color;
                
                // Calculate position and size
                let width = CELL_SIZE;
                let height = CELL_SIZE;
                let top = a.r * CELL_SIZE;
                let left = a.c * CELL_SIZE;

                if (a.dir === 1 || a.dir === 3) { // Horizontal
                    width = a.len * CELL_SIZE;
                    // If moving Left (3), the 'r/c' is the tail, so we render normally
                    // We treat (r,c) as the Top-Left corner of the bounding box for simplicity
                } else { // Vertical
                    height = a.len * CELL_SIZE;
                }

                el.style.width = (width - 4) + 'px'; // -4 for gap
                el.style.height = (height - 4) + 'px';
                el.style.top = (top + 2) + 'px';
                el.style.left = (left + 2) + 'px';

                el.onclick = () => tryMove(a, el);
                board.appendChild(el);
            });
        }

        function tryMove(arrow, element) {
            if (isBlocked(arrow)) {
                // Shake effect
                element.classList.add('shake');
                statusText.innerText = "Blocked!";
                setTimeout(() => element.classList.remove('shake'), 300);
            } else {
                // Move effect
                statusText.innerText = "Whoosh!";
                let moveX = 0; 
                let moveY = 0;
                
                if(arrow.dir === 0) moveY = -400;
                if(arrow.dir === 1) moveX = 400;
                if(arrow.dir === 2) moveY = 400;
                if(arrow.dir === 3) moveX = -400;

                element.style.transform = `translate(${moveX}px, ${moveY}px)`;
                element.style.opacity = '0';

                // Remove from data array after delay
                setTimeout(() => {
                    arrows = arrows.filter(item => item.id !== arrow.id);
                    // Don't re-render immediately or the animation snaps back
                    // We just leave the DOM element flying away
                }, 300);
            }
        }

        function isBlocked(currentArrow) {
            // 1. Calculate the path to the edge
            let pathCells = [];
            let headR = currentArrow.r;
            let headC = currentArrow.c;

            // Adjust head position based on length and direction
            // (Our data model: r,c is always the TOP-LEFT of the block)
            if (currentArrow.dir === 1) headC += (currentArrow.len - 1); // Head is at far right
            if (currentArrow.dir === 2) headR += (currentArrow.len - 1); // Head is at bottom

            // Generate path cells from Head + 1 to Edge
            if (currentArrow.dir === 0) { // Up
                for (let r = headR - 1; r >= 0; r--) pathCells.push({r: r, c: headC});
            } else if (currentArrow.dir === 1) { // Right
                for (let c = headC + 1; c < GRID_SIZE; c++) pathCells.push({r: headR, c: c});
            } else if (currentArrow.dir === 2) { // Down
                for (let r = headR + 1; r < GRID_SIZE; r++) pathCells.push({r: r, c: headC});
            } else if (currentArrow.dir === 3) { // Left
                for (let c = headC - 1; c >= 0; c--) pathCells.push({r: headR, c: c});
            }

            // 2. Check if any OTHER arrow occupies these path cells
            for (let other of arrows) {
                if (other.id === currentArrow.id) continue;

                // Calculate occupied cells of the 'other' arrow
                let otherCells = [];
                for (let i = 0; i < other.len; i++) {
                    if (other.dir === 1 || other.dir === 3) {
                        otherCells.push({r: other.r, c: other.c + i});
                    } else {
                        otherCells.push({r: other.r + i, c: other.c});
                    }
                }

                // Collision check
                for (let p of pathCells) {
                    for (let o of otherCells) {
                        if (p.r === o.r && p.c === o.c) return true; // BLOCKED
                    }
                }
            }

            return false;
        }

        init();
    </script>
</body>
</html>
